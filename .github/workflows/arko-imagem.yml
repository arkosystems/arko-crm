# ARKO: constroi a imagem do ARKO CRM a partir do Dockerfile do Twenty e publica no GHCR.
# Sem segredo proprio: usa so o GITHUB_TOKEN do proprio workflow.
# Os arquivos de marca (logo, favicon) nao entram na imagem; sao montados no servidor.
name: ARKO imagem

on:
  workflow_dispatch:
  push:
    tags:
      - 'arko-*'

permissions:
  contents: read
  packages: write

env:
  TWENTY_VERSION: v1.15.0

concurrency:
  group: arko-imagem-${{ github.ref }}
  cancel-in-progress: false

jobs:
  imagem:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Nome da imagem em minusculas
        id: nome
        env:
          DONO: ${{ github.repository_owner }}
        run: echo "imagem=ghcr.io/${DONO,,}/arko-crm" >> "$GITHUB_OUTPUT"

      - name: Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir e publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/twenty-docker/twenty/Dockerfile
          platforms: linux/amd64
          push: true
          # APP_VERSION precisa ser a versao semver do Twenty de base (o servidor
          # valida e o comando de upgrade da subida compara com ela); nao use a tag arko-*
          build-args: |
            APP_VERSION=${{ env.TWENTY_VERSION }}
          tags: |
            ${{ steps.nome.outputs.imagem }}:${{ github.ref_name }}
            ${{ steps.nome.outputs.imagem }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=ARKO CRM
            org.opencontainers.image.licenses=AGPL-3.0
          cache-from: type=gha
          cache-to: type=gha,mode=max
